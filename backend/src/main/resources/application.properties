spring.application.name=library-backend

# Server Configuration
server.port=8081

# H2 Database Configuration (Default for Local Development & Testing)
spring.datasource.url=jdbc:h2:mem:librarydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 Console Configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Multipart File Upload Settings (Book Cover Images & CSV Import)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Static Resource Handler for Cover Uploads
spring.web.resources.static-locations=classpath:/static/,file:uploads/

# JWT Configuration Defaults
app.jwt.secret=LibraryManagementSystemSuperSecretKeyWithAtLeast256BitsLength123456
app.jwt.expiration-ms=86400000

